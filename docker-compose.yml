services:
  kb:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      KB_DATABASE_URL: sqlite:///./data/knowledge.db
    volumes:
      - kb_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kb_data:
