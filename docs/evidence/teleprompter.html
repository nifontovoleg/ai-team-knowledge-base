<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Телесуфлёр — защита проекта</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #f5f5f5;
      --muted: #888;
      --accent: #4ade80;
      --panel: #161616;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", Arial, sans-serif; }
    .toolbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 10px 14px; background: rgba(10,10,10,0.95); border-bottom: 1px solid #333;
    }
    .toolbar label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .toolbar input[type=range] { width: 100px; }
    button {
      background: #222; color: #fff; border: 1px solid #444; border-radius: 8px;
      padding: 8px 14px; cursor: pointer; font-size: 14px;
    }
    button:hover { background: #333; }
    button.primary { background: #166534; border-color: #4ade80; }
    button.primary:hover { background: #15803d; }
    .stage {
      padding: 100px 8vw 40vh; max-width: 1100px; margin: 0 auto;
      font-size: clamp(28px, 4.2vw, 52px); line-height: 1.55; font-weight: 500;
    }
    .section { margin-bottom: 3em; scroll-margin-top: 120px; }
    .section h2 {
      font-size: 0.55em; color: var(--accent); text-transform: uppercase;
      letter-spacing: 0.08em; margin: 0 0 0.6em; font-weight: 700;
    }
    .section p { margin: 0; }
    .hint {
      position: fixed; bottom: 0; left: 0; right: 0; padding: 10px 16px;
      background: rgba(22,22,22,0.95); font-size: 13px; color: var(--muted); text-align: center;
    }
    .mirror .stage { transform: scaleX(-1); }
    audio { height: 32px; max-width: 280px; }
    .recording { color: #f87171; font-weight: 700; animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }
    .progress { flex: 1; min-width: 120px; max-width: 200px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
    .progress > div { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="btn-start" class="primary">▶ Старт прокрутки</button>
    <button id="btn-pause">⏸ Пауза</button>
    <button id="btn-reset">↺ В начало</button>
    <label>Скорость <input type="range" id="speed" min="20" max="120" value="52" /></label>
    <label>Шрифт <input type="range" id="font" min="24" max="64" value="42" /></label>
    <button id="btn-mirror">Зеркало</button>
    <button id="btn-full">На весь экран</button>
    <audio id="ref-audio" controls src="defense_reference_dmitry.mp3"></audio>
    <button id="btn-sync">Синхр. с аудио</button>
    <div class="progress" title="Прогресс"><div id="prog"></div></div>
    <span id="section-label" style="font-size:13px;color:#888">Раздел 1/7</span>
  </div>

  <div class="stage" id="stage"></div>
  <p class="hint">Win+G — запись экрана+микрофона · Пробел — пауза · ↑↓ — скорость · F — полный экран</p>

  <script>
    const SECTIONS = [
      { title: "1. Проблема и ценность", text: `Здравствуйте. Представляю проект «Система знаний команды» — поиск по своим данным плюс память. Проблема простая: знания команды разбросаны по файлам и чатам, одни и те же вопросы повторяются, а ответы часто додумываются. Это опасно для онбординга и поддержки клиентов. Решение — веб-панель, где ответы строятся только по найденным фрагментам документов с цитатами. Если опоры в базе нет — система честно ставит метку ручной проверки needs review и говорит, что данных недостаточно, а не выдумывает факты. Кому полезно: новичкам в команде, менеджерам и тимлидам, которым нужна единая точка правды по внутренним правилам, шаблонам ответов и процессам.` },
      { title: "2. Контекст и ограничения", text: `Проект сделан как воспроизводимая учебная и рабочая витрина. Интерфейс — только веб-панель с тремя вкладками: документы, вопросы и история. База данных — SQLite. Поиск — keyword по фрагментам, без тяжёлых embeddings. Есть режим с LLM через Proxy API и offline extractive-режим без ключа. Нет ролей и разграничения доступа, нет загрузки PDF — документы подаются как текст. Эти ограничения осознанные: быстрее запуск, проще аудит и защита, проще повторить результат по README и Docker за десять минут.` },
      { title: "3. Архитектура", text: `Архитектура линейная и прозрачная. Пользователь работает в веб-панели. Запросы принимает FastAPI. Документы и абзацы-фрагменты snippets хранятся в SQLite. По вопросу система ищет top K подходящих фрагментов. Если фрагменты найдены — они идут в LLM как context. Модель возвращает строгий JSON: answer, sources, confidence и needs review. Температура низкая — ноль целых одна десятая. Дальше контроль качества: пустые источники или низкая уверенность ведут к ручной проверке. Каждое ключевое действие пишется в таблицу audit runs: вход, выход, статус, ошибка и время. Если подходящих фрагментов нет — LLM не вызывается. Сразу безопасный ответ «данных недостаточно» и needs review равно true.` },
      { title: "4. Риски и меры", text: `Риск первый — галлюцинации модели. Мера: ответ только по context, строгий JSON и needs review. Риск второй — утечка секретов. Мера: ключи только в env, gitignore, запрет секретов в документах. Риск третий — пустая база знаний. Мера: честный отказ без вызова модели. Риск четвёртый — нестабильный формат ответа LLM. Мера: валидация Pydantic и fallback в review. Риск пятый — потеря воспроизводимости. Мера: Docker, seed-скрипт, tests data и короткая инструкция. Дополнительно: offline-режим явно помечен в ответе, цитаты-источники обязательны.` },
      { title: "5. Внедрение за 1 день", text: `План внедрения на один рабочий день. Утро: поднять сервис по README или Docker Compose, скопировать env example в env. Днём: загрузить от пяти до двадцати актуальных внутренних документов и прогнать десять контрольных вопросов из tests data. Вечером: показать операторам вкладку «требует проверки», настроить ключ LLM и проверить три curl-запроса из README. После этого команда уже может пользоваться панелью как единой точкой ответов с аудитом.` },
      { title: "6. План развития", text: `План развития из четырёх шагов. Первое — гибридный поиск: keyword плюс embeddings для более точного нахождения фрагментов. Второе — роли и доступ к документам, чтобы разные команды видели разные материалы. Третье — загрузка файлов PDF и Markdown без ручного копирования текста. Четвёртое — кнопка «подтвердить или исправить» для needs review с обратной записью правильного ответа в базу знаний. Так система из витрины ответов вырастет в полноценный контур управления знаниями команды.` },
      { title: "7. Мини-экономика и итог", text: `Мини-экономика из отчёта. До внедрения типовой вопрос занимает около пятнадцати минут поиска по файлам и людям. После — примерно одна-две минуты: открыть панель и проверить цитаты. На ста операциях это порядка двадцати пяти часов против примерно трёх часов. Оценка на салфетке — экономия более двадцати часов на сотне однотипных вопросов онбординга или поддержки. Итог в трёх строках для портфолио. Проблема: знания разбросаны и ответы додумываются. Решение: поиск по своим документам, строгий JSON и ручная проверка. Результат: ответы с источниками, история QA, аудит и запуск по README и Docker. Спасибо за внимание. Готов ответить на вопросы.` },
    ];

    const stage = document.getElementById("stage");
    SECTIONS.forEach((s, i) => {
      const el = document.createElement("div");
      el.className = "section";
      el.id = "sec-" + i;
      el.innerHTML = `<h2>${s.title}</h2><p>${s.text}</p>`;
      stage.appendChild(el);
    });

    let scrolling = false;
    let raf = null;
    let syncMode = false;
    const speedEl = document.getElementById("speed");
    const fontEl = document.getElementById("font");
    const audio = document.getElementById("ref-audio");
    const prog = document.getElementById("prog");
    const sectionLabel = document.getElementById("section-label");

    function pxPerSec() { return Number(speedEl.value); }
    function applyFont() {
      stage.style.fontSize = fontEl.value + "px";
    }
    applyFont();
    fontEl.oninput = applyFont;

    function tick() {
      if (!scrolling) return;
      if (syncMode && audio.duration) {
        const ratio = audio.currentTime / audio.duration;
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        window.scrollTo(0, ratio * maxScroll);
        prog.style.width = (ratio * 100) + "%";
      } else {
        window.scrollBy(0, pxPerSec() / 60);
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        prog.style.width = Math.min(100, (window.scrollY / maxScroll) * 100) + "%";
      }
      updateSectionLabel();
      raf = requestAnimationFrame(tick);
    }

    function updateSectionLabel() {
      const y = window.scrollY + 140;
      let idx = 0;
      for (let i = 0; i < SECTIONS.length; i++) {
        const el = document.getElementById("sec-" + i);
        if (el && el.offsetTop <= y) idx = i;
      }
      sectionLabel.textContent = `Раздел ${idx + 1}/${SECTIONS.length}`;
    }

    function startScroll() {
      scrolling = true;
      if (syncMode) audio.play();
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(tick);
    }
    function pauseScroll() {
      scrolling = false;
      if (syncMode) audio.pause();
      cancelAnimationFrame(raf);
    }
    function resetScroll() {
      pauseScroll();
      window.scrollTo(0, 0);
      audio.currentTime = 0;
      prog.style.width = "0%";
      updateSectionLabel();
    }

    document.getElementById("btn-start").onclick = startScroll;
    document.getElementById("btn-pause").onclick = pauseScroll;
    document.getElementById("btn-reset").onclick = resetScroll;
    document.getElementById("btn-mirror").onclick = () => document.body.classList.toggle("mirror");
    document.getElementById("btn-full").onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    };
    document.getElementById("btn-sync").onclick = () => {
      syncMode = !syncMode;
      document.getElementById("btn-sync").textContent = syncMode ? "Синхр: ВКЛ" : "Синхр. с аудио";
      document.getElementById("btn-sync").classList.toggle("primary", syncMode);
    };

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") { e.preventDefault(); scrolling ? pauseScroll() : startScroll(); }
      if (e.code === "ArrowUp") { speedEl.value = Math.min(120, Number(speedEl.value) + 5); }
      if (e.code === "ArrowDown") { speedEl.value = Math.max(20, Number(speedEl.value) - 5); }
      if (e.code === "KeyF") document.getElementById("btn-full").click();
    });

    audio.addEventListener("timeupdate", () => {
      if (syncMode && scrolling) {
        const ratio = audio.currentTime / audio.duration;
        prog.style.width = (ratio * 100) + "%";
      }
    });
    audio.addEventListener("ended", () => { scrolling = false; cancelAnimationFrame(raf); });
  </script>
</body>
</html>
